name = "familyledger"
main = "dist/worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[build]
command = "node build.mjs"

# Free Cloudflare AI: merchant identification, PDF reading, analysis (10,000 neurons/day free)
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "family-ledger"
database_id = "10138ce1-ea13-4a65-b87e-00f8ec3972ed"

[vars]
# Login is "Sign in with Google", built into the app.
# The Google OAuth client ID and the family email list are kept in the D1 database
# (tables `settings` and `members`), so they never appear in this public repo.
# You can also set the client ID here instead (it isn't secret):
GOOGLE_CLIENT_ID = ""
# Optional extra emails allowed in, in addition to the `members` table.
ALLOWED_EMAILS = ""
# Optional, only if you also put Cloudflare Access with a custom domain in front: team domain + AUD tag.
TEAM_DOMAIN = ""
POLICY_AUD = ""
# Optional: a different Workers AI chat model
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
