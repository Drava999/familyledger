name = "familyledger"
main = "dist/worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[build]
command = "node build.mjs"

# Free Cloudflare AI: merchant identification, PDF reading, analysis (10,000 neurons/day free)
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "family-ledger"
database_id = "10138ce1-ea13-4a65-b87e-00f8ec3972ed"

[vars]
# Login: in Cloudflare open Workers & Pages > familyledger > Access tab > "Protect this Worker behind Access" (All traffic).
# The worker reads the signed-in email from Cloudflare directly; nothing to paste here.
# Only for a custom domain protected by hostname-based Access: team domain + AUD tag.
TEAM_DOMAIN = ""
POLICY_AUD = ""
# Optional extra lock: only these emails may use the site, even if Access lets others in.
ALLOWED_EMAILS = ""
# Optional: a different Workers AI chat model
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
