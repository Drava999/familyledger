<div class="shell">
  <aside class="side" aria-label="Sections">
    <span class="brand">Family Ledger</span>
    <button class="btn dark" id="addSide" type="button"><svg class="i"><use href="#i-add"/></svg>Add statements</button>
    <nav id="sideNav"></nav>
    <div class="foot"><span id="saveStateSide"></span><span id="whoSide"></span></div>
  </aside>
  <main class="main" id="main">
    <div class="head">
      <h1 id="title">Overview</h1>
      <div class="tools">
        <div class="who" id="who" role="group" aria-label="Whose money"></div>
        <select id="monthSel" aria-label="Period"></select>
        <button class="iconbtn add-m" id="addTop" type="button" aria-label="Add statements"><svg class="i"><use href="#i-add"/></svg></button>
      </div>
    </div>
    <div id="alerts" class="stack" style="gap:8px"></div>
    <div class="banner" id="exampleBanner" hidden><b>Example data.</b> Made-up transactions so you can see how it works. They disappear when you add your first statement.</div>
    <div class="seg" id="subtabs" role="tablist" hidden></div>
    <div id="view" class="stack" style="gap:14px"></div>
    <p class="tiny muted" id="saveState" style="text-align:center"></p>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<input type="file" id="fileIn" accept=".csv,.xls,.xlsx,.pdf,text/csv,application/pdf" multiple hidden>
<input type="file" id="bizIn" accept=".csv,.xls,.xlsx,text/csv" hidden>
